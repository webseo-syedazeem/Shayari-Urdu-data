<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shayari Quotes Discovery UI</title>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <!--
      title/description/keywords/canonical/og:*/twitter:* are all managed by
      react-helmet-async via the root <Seo /> in App.tsx (overridden per-page
      where a page renders its own <Seo>). They're intentionally omitted here:
      react-helmet-async only reconciles tags it rendered itself, so a static
      duplicate left here would sit alongside the correct dynamic one with no
      defined precedence between them.
    -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BKNM08V04K"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BKNM08V04K');
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3395920694198700" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
